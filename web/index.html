<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RedFlag</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23d4202a'/%3E%3Cpath d='M9 6v20M9 8h14l-4 5 4 5H9' fill='none' stroke='white' stroke-width='2.4' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app" class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><span class="brand-name">RedFlag</span></div>
      <nav id="nav"></nav>
      <div class="sidebar-foot" id="sidebar-foot">—</div>
    </aside>
    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menu-btn" aria-label="Меню"></button>
        <h1 id="page-title">Панель</h1>
        <div class="topbar-spacer"></div>
        <div class="range" id="range" role="group" aria-label="Интервал"></div>
        <label class="auto"><input type="checkbox" id="auto" checked> обновлять</label>
        <span class="conn" id="conn" title="Связь с сервисом"><i class="dot"></i><span id="conn-text">…</span></span>
        <button class="btn ghost" id="key-btn" title="Ключ доступа к API" aria-label="Ключ доступа к API"></button>
      </header>
      <main class="content" id="content" aria-live="polite"></main>
    </div>
  </div>
  <div id="drawer" class="drawer" hidden></div>
  <div id="toast" class="toast" hidden></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
