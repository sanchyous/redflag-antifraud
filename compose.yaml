services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      ADDR: ":8000"
      DATABASE_URL: "postgres://${POSTGRES_USER:-redflag}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-redflag}?sslmode=disable"
      # Справочник плана нумерации (Россвязь) — данные вне git, монтируются с хоста.
      NUMPLAN_DIR: "${NUMPLAN_DIR:-}"
      # Необязательные файлы конфигурации (пути внутри контейнера, каталог /data/config).
      ALLOWLIST_FILE: "${ALLOWLIST_FILE:-}"
      MODEL_FILE: "${MODEL_FILE:-}"
      REVIEW_THRESHOLD: "${REVIEW_THRESHOLD:-0}"
      BLOCK_THRESHOLD: "${BLOCK_THRESHOLD:-0}"
      BLOCK_MIN_SIGNALS: "${BLOCK_MIN_SIGNALS:-2}"
      WINDOW_MAX_EVENTS: "${WINDOW_MAX_EVENTS:-512}"
      WINDOW_MAX_NUMBERS: "${WINDOW_MAX_NUMBERS:-4000000}"
      SHORT_CALL_SEC: "${SHORT_CALL_SEC:-10}"
      MAX_FUTURE_SKEW_SEC: "${MAX_FUTURE_SKEW_SEC:-0}"
      FAN_REFRESH_SEC: "${FAN_REFRESH_SEC:-30}"
      JOURNAL_ALLOW_SAMPLE: "${JOURNAL_ALLOW_SAMPLE:-0.01}"
      LOG_FORMAT: "json"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      API_KEY: "${API_KEY:-}"
      FAIL_MODE: "${FAIL_MODE:-open}"
    volumes:
      - "${NUMPLAN_HOST_DIR:-./data/numplan}:/data/numplan:ro"
      - "${CONFIG_HOST_DIR:-./data/config}:/data/config:ro"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  postgres:
    image: postgres:17-alpine
    container_name: redflag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-redflag}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required (создай .env по .env.example)}"
      POSTGRES_DB: "${POSTGRES_DB:-redflag}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-redflag}"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
