# Ротация логов — одна на все сервисы (YAML-якорь): без неё json-file-драйвер Docker по умолчанию не
# ограничен и за недели работы способен забить диск. Лимиты ресурсов — чтобы один контейнер (например,
# ML при всплеске трафика) не положил машину целиком; если тесно — поднять numbers, не убирать секцию.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    logging: *default-logging
    deploy:
      resources:
        limits: { cpus: "2", memory: 1g }
        reservations: { memory: 128m }
    environment:
      ADDR: ":8000"
      DATABASE_URL: "postgres://${POSTGRES_USER:-redflag}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-redflag}?sslmode=disable"
      # Справочник плана нумерации (Россвязь) — данные вне git, монтируются с хоста.
      NUMPLAN_DIR: "${NUMPLAN_DIR:-}"
      # Необязательные файлы конфигурации (пути внутри контейнера, каталог /data/config).
      ALLOWLIST_FILE: "${ALLOWLIST_FILE:-}"
      MODEL_FILE: "${MODEL_FILE:-}"
      REVIEW_THRESHOLD: "${REVIEW_THRESHOLD:-0}"
      BLOCK_THRESHOLD: "${BLOCK_THRESHOLD:-0}"
      BLOCK_MIN_SIGNALS: "${BLOCK_MIN_SIGNALS:-2}"
      RATE_LIMIT_RPS: "${RATE_LIMIT_RPS:-0}"
      WINDOW_MAX_EVENTS: "${WINDOW_MAX_EVENTS:-512}"
      WINDOW_MAX_NUMBERS: "${WINDOW_MAX_NUMBERS:-4000000}"
      SHORT_CALL_SEC: "${SHORT_CALL_SEC:-10}"
      MAX_FUTURE_SKEW_SEC: "${MAX_FUTURE_SKEW_SEC:-0}"
      FAN_REFRESH_SEC: "${FAN_REFRESH_SEC:-30}"
      JOURNAL_ALLOW_SAMPLE: "${JOURNAL_ALLOW_SAMPLE:-0.01}"
      LOG_FORMAT: "${LOG_FORMAT:-json}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      LOG_DECISIONS: "${LOG_DECISIONS:-flagged}"
      LOG_RATE_PER_SEC: "${LOG_RATE_PER_SEC:-200}"
      API_KEY: "${API_KEY:-}"
      FAIL_MODE: "${FAIL_MODE:-open}"
      ML_URL: "${ML_URL:-}"
      ML_API_KEY: "${ML_API_KEY:-}"
      ML_TIMEOUT_MS: "${ML_TIMEOUT_MS:-50}"
      ML_BREAKER_FAILS: "${ML_BREAKER_FAILS:-5}"
      ML_BREAKER_COOLDOWN_SEC: "${ML_BREAKER_COOLDOWN_SEC:-10}"
    volumes:
      - "${NUMPLAN_HOST_DIR:-./data/numplan}:/data/numplan:ro"
      - "${CONFIG_HOST_DIR:-./data/config}:/data/config:ro"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ML-сервис (стадия 2 каскада). Порт наружу не публикуется: доступен ядру по сети compose.
  # Без модели в /models сервис отвечает 503, ядро откатывается на линейную стадию.
  # Профиль ml: сервис включается переменной COMPOSE_PROFILES=ml в .env на сервере, когда образ можно
  # собрать (нужен доступ к PyPI) и в /models лежит обученная модель. Без профиля ядро работает на
  # линейной стадии, а деплой не зависит от сборки Python-образа.
  ml:
    profiles: ["ml"]
    build: ./services/ml
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits: { cpus: "2", memory: 2g }
        reservations: { memory: 256m }
    environment:
      MODEL_DIR: "/models"
      API_KEY: "${ML_API_KEY:-}"
      LOG_FORMAT: "${LOG_FORMAT:-json}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    volumes:
      - "${ML_MODELS_HOST_DIR:-./data/models}:/models:ro"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  postgres:
    image: postgres:17-alpine
    container_name: redflag-postgres
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits: { cpus: "1", memory: 512m }
        reservations: { memory: 64m }
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-redflag}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required (создай .env по .env.example)}"
      POSTGRES_DB: "${POSTGRES_DB:-redflag}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-redflag}"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
