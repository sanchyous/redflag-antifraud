services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      ADDR: ":8000"
      REDIS_ADDR: "redis:6379"
      DATABASE_URL: "postgres://${POSTGRES_USER:-redflag}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-redflag}?sslmode=disable"
      RULES_MAX_AMOUNT: "${RULES_MAX_AMOUNT:-100000}"
      RULES_ALLOWED_CURRENCIES: "${RULES_ALLOWED_CURRENCIES:-RUB,USD,EUR}"
      RULES_BLOCKED_USERS: "${RULES_BLOCKED_USERS:-}"
      RULES_BLOCKED_IPS: "${RULES_BLOCKED_IPS:-}"
      VELOCITY_MAX_PER_USER: "${VELOCITY_MAX_PER_USER:-10}"
      VELOCITY_MAX_PER_IP: "${VELOCITY_MAX_PER_IP:-30}"
      LOG_FORMAT: "json"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      API_KEY: "${API_KEY:-}"
      FAIL_MODE: "${FAIL_MODE:-open}"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: redflag-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:17-alpine
    container_name: redflag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-redflag}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required (создай .env по .env.example)}"
      POSTGRES_DB: "${POSTGRES_DB:-redflag}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-redflag}"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
