name: Debug Model Push (temporary)
on:
  workflow_dispatch:

jobs:
  push-model:
    runs-on: [self-hosted, redflag]
    steps:
      - name: Inspect ml container
        run: |
          docker ps -a --filter name=ml
          echo ---logs---
          docker logs --tail 60 redflag-antifraud-ml-1 2>&1 || docker compose logs --tail 60 ml
          echo ---files---
          ls -la /home/deploy/redflag/models/current/
