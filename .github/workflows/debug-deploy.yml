name: Debug Model Push (temporary)
on:
  workflow_dispatch:

jobs:
  push-model:
    runs-on: [self-hosted, redflag]
    steps:
      - uses: actions/checkout@v4
      - name: Fix model file permissions and restart ml
        run: |
          set -euo pipefail
          chmod 755 /home/deploy/redflag/models/current
          chmod 644 /home/deploy/redflag/models/current/*
          chmod 644 /home/deploy/redflag/config/stage1.json
          ls -la /home/deploy/redflag/models/current/ /home/deploy/redflag/config/
          docker compose --env-file /home/deploy/redflag/.env up -d --force-recreate app ml
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then exit 0; fi
            sleep 2
          done
          echo "health check failed" >&2
          exit 1
