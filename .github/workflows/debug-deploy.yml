name: Debug Deploy
on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: [self-hosted, redflag]
    steps:
      - name: Container state and logs
        run: |
          echo "=== docker ps -a ==="
          docker ps -a
          echo "=== app container logs (tail 150) ==="
          docker logs --tail=150 redflag-antifraud-app-1 2>&1 || true
          echo "=== app container inspect (env, mounts) ==="
          docker inspect redflag-antifraud-app-1 --format '{{json .Config.Env}}' || true
          docker inspect redflag-antifraud-app-1 --format '{{json .Mounts}}' || true
          echo "=== compose project dir ==="
          find / -maxdepth 4 -iname "compose.yaml" -o -iname "docker-compose.yml" 2>/dev/null | grep -v proc
