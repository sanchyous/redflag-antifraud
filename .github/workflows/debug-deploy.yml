name: Debug Deploy
on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: [self-hosted, redflag]
    steps:
      - name: Pull freshly trained models from the training host and restart
        env:
          XFER_KEY: ${{ secrets.MODEL_XFER_KEY }}
        run: |
          set -e
          echo "$XFER_KEY" > /tmp/xfer_id
          chmod 600 /tmp/xfer_id
          SSH="ssh -i /tmp/xfer_id -o StrictHostKeyChecking=accept-new"
          SCP="scp -i /tmp/xfer_id -o StrictHostKeyChecking=accept-new"

          echo "=== backup current config ==="
          cp /home/deploy/redflag/config/stage1.json /home/deploy/redflag/config/stage1.json.pre-retrain-$(date +%s) || true
          mkdir -p /home/deploy/redflag/models/current
          cp -r /home/deploy/redflag/models/current /home/deploy/redflag/models/current.pre-retrain-$(date +%s) || true

          echo "=== pull stage1.json ==="
          $SCP root@192.168.10.141:/root/training/models/stage1.json /home/deploy/redflag/config/stage1.json

          echo "=== pull catboost model dir ==="
          rm -rf /home/deploy/redflag/models/current
          mkdir -p /home/deploy/redflag/models/current
          $SCP -r root@192.168.10.141:/root/training/models/current/* /home/deploy/redflag/models/current/

          rm -f /tmp/xfer_id
          ls -la /home/deploy/redflag/config/stage1.json /home/deploy/redflag/models/current/

          echo "=== restart app + ml ==="
          docker restart redflag-antifraud-app-1 redflag-antifraud-ml-1

          sleep 3
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/health; then echo OK; exit 0; fi
            sleep 2
          done
          echo "still unhealthy" >&2
          docker logs --tail=60 redflag-antifraud-app-1
          docker logs --tail=60 redflag-antifraud-ml-1
          exit 1
