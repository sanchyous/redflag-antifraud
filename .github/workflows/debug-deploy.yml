name: Debug Model Push (temporary)
on:
  workflow_dispatch:

jobs:
  push-model:
    runs-on: [self-hosted, redflag]
    steps:
      - name: Pull trained model from training host and restart
        run: |
          set -euo pipefail
          umask 077
          mkdir -p /tmp/model-push-key
          printf '%s\n' "${{ secrets.MODEL_PUSH_KEY }}" > /tmp/model-push-key/id_ed25519
          chmod 600 /tmp/model-push-key/id_ed25519
          SSH="ssh -i /tmp/model-push-key/id_ed25519 -o StrictHostKeyChecking=no"

          cp /home/deploy/redflag/config/stage1.json "/home/deploy/redflag/config/stage1.json.pre-retrain-$(date +%s)"
          cp -r /home/deploy/redflag/models/current "/home/deploy/redflag/models/current.pre-retrain-$(date +%s)"

          $SSH root@192.168.10.141 "cat /root/training/repo/services/ml/models/stage1.json" > /home/deploy/redflag/config/stage1.json
          mkdir -p /home/deploy/redflag/models/current.new
          for f in model.cbm meta.json report.json; do
            $SSH root@192.168.10.141 "cat /root/training/repo/services/ml/models/current/$f" > "/home/deploy/redflag/models/current.new/$f"
          done
          rm -rf /home/deploy/redflag/models/current
          mv /home/deploy/redflag/models/current.new /home/deploy/redflag/models/current

          rm -rf /tmp/model-push-key
          cd /home/deploy/redflag && docker compose --env-file /home/deploy/redflag/.env up -d --force-recreate app ml

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then exit 0; fi
            sleep 2
          done
          echo "health check failed" >&2
          exit 1
