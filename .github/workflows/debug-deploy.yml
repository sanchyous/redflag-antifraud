name: Debug Deploy
on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: [self-hosted, redflag]
    steps:
      - name: Locate deploy env and config dir
        run: |
          echo "=== app container inspect (env) ==="
          docker inspect redflag-antifraud-app-1 --format '{{json .Config.Env}}'
          echo "=== app container inspect (mounts) ==="
          docker inspect redflag-antifraud-app-1 --format '{{json .Mounts}}'
          echo "=== compose project dirs ==="
          find /home -maxdepth 5 \( -iname "compose.yaml" -o -iname ".env" \) 2>/dev/null
