name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, redflag]
    steps:
      - uses: actions/checkout@v4
      - name: Deploy with docker compose
        run: docker compose --env-file /home/deploy/redflag/.env up -d --build
      - name: Health check
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then exit 0; fi
            sleep 2
          done
          echo "health check failed" >&2
          exit 1
      # Индексы графовых детекторов (веер, карусель, SIM-box, цепочка) живут только в памяти
      # процесса — рестарт при каждом деплое их обнуляет. Без пересева «Граф связей» выглядит
      # пустым до накопления нового трафика, поэтому сеем демо-сценарии сразу после рестарта.
      - name: Reseed graph demo data
        run: |
          set -a; source /home/deploy/redflag/.env; set +a
          python3 scripts/demo.py --url http://127.0.0.1:8000 --api-key "${API_KEY:-}" --graph
